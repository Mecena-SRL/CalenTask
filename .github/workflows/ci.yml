name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-tests:
    name: Test (macOS)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project CalenTask.xcodeproj \
            -scheme CalenTask \
            -destination 'platform=macOS' \
            -only-testing:CalenTaskTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild-test.log | grep -E "error:|warning: .*CalenTask/|Test (Suite|Case)|✔|✘|\*\* (TEST|BUILD)" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild-test.log
      - name: Errori di compilazione
        if: failure()
        run: |
          grep -n -B2 -A4 -E "error|: note:|Stack dump|Assertion|Please submit" xcodebuild-test.log | head -300 || true
          echo "--- ultime righe del log ---"
          grep -v -E "^\s*(cd|export|builtin-|/Applications/Xcode)" xcodebuild-test.log | tail -150
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-test-log
          path: xcodebuild-test.log

  ios-build:
    name: Build (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project CalenTask.xcodeproj \
            -scheme CalenTask \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild-ios.log | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" xcodebuild-ios.log
      - name: Errori di compilazione
        if: failure()
        run: |
          grep -n -B2 -A4 -E "error|: note:|Stack dump|Assertion|Please submit" xcodebuild-ios.log | head -300 || true
          echo "--- ultime righe del log ---"
          grep -v -E "^\s*(cd|export|builtin-|/Applications/Xcode)" xcodebuild-ios.log | tail -150
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-ios-log
          path: xcodebuild-ios.log
